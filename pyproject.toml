[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proof-carrying-analyst"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "python-multipart>=0.0.20,<1",
  "jsonschema>=4.23,<5", "PyYAML>=6,<7", "pydantic>=2.10,<3",
  "duckdb>=1.4,<2", "pandas>=2.2,<4", "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.1,<3", "openai>=2,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "xlwt>=1.3"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["intent_model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon and built sandbox image"]
